<section class="page-shell">
  <div class="page-header">
    <div>
      <p class="eyebrow">SYSTEM</p>
      <h1>Settings</h1>
    </div>
  </div>

  <div class="settings-grid" *ngIf="settings() as current">
    <div class="panel">
      <h3>Appearance</h3>
      <label>
        Theme
        <select [(ngModel)]="current.theme" (ngModelChange)="saveSettings()">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </label>
    </div>

    <div class="panel">
      <h3>Editor</h3>
      <label>
        Font size
        <input type="number" [(ngModel)]="current.editorFontSize" (ngModelChange)="saveSettings()" />
      </label>
      <label>
        Line spacing
        <input type="number" step="0.1" [(ngModel)]="current.editorLineSpacing" (ngModelChange)="saveSettings()" />
      </label>
      <label class="checkbox-row">
        <input type="checkbox" [(ngModel)]="current.editorLineNumbers" (ngModelChange)="saveSettings()" />
        Line numbers
      </label>
      <label class="checkbox-row">
        <input type="checkbox" [(ngModel)]="current.autosaveEnabled" (ngModelChange)="saveSettings()" />
        Autosave
      </label>
    </div>

    <div class="panel">
      <h3>Audio</h3>
      <label>
        Default BPM
        <input type="number" [(ngModel)]="current.defaultBpm" (ngModelChange)="saveSettings()" />
      </label>
      <label>
        Metronome volume
        <input type="range" min="0" max="1" step="0.05" [(ngModel)]="current.metronomeVolume" (ngModelChange)="saveSettings()" />
      </label>
      <label class="checkbox-row">
        <input type="checkbox" [(ngModel)]="current.accentBeat" (ngModelChange)="saveSettings()" />
        Accent beat
      </label>
    </div>

    <div class="panel">
      <h3>Data</h3>
      <button type="button" class="secondary-button" (click)="exportVault()">Export Vault</button>
      <label class="upload-label">
        Import Vault
        <input type="file" accept="application/json" (change)="importVault($event)" />
      </label>
    </div>
  </div>
</section>
