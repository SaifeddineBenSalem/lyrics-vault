<section class="tags-page"><div class="page-header"><div><p class="eyebrow">ORGANIZE</p><h1>Tags</h1></div></div><div class="tag-grid" *ngIf="tags().length; else empty"><div class="tag-card" *ngFor="let item of tags()"><strong>{{ item[0] }}</strong><span>{{ item[1] }} {{ item[1] === 1 ? 'song' : 'songs' }}</span></div></div><ng-template #empty><div class="empty-state">Tags appear here as you add them to songs.</div></ng-template></section>
